# Docker running inside WSL2 cannot safely host PostgreSQL's data directory on
# the NTFS checkout mount. Keep this private, durable Master database in the
# Docker engine's Linux volume; tenant workspaces remain separately managed by
# the native Hyper-V Worker under .agentworks.
services:
  postgres:
    volumes:
      - agentworks_windows_postgres:/var/lib/postgresql/data
  master:
    # WSL2 forwards services listening on its all-interface address to Windows
    # localhost. The base file's 127.0.0.1 mapping is only loopback inside the
    # WSL VM, which leaves the native Hyper-V Worker unable to reach Master.
    ports:
      - "${MASTER_PORT:-8080}:8080"

volumes:
  agentworks_windows_postgres:
